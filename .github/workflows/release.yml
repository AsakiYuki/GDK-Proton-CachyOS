name: Build and release GDK-Proton

on:
  workflow_dispatch:
    inputs:
      proton_version:
        description: "GE-Proton version to base the build on (e.g. Proton11-12)"
        required: true
        default: "Proton11-12"

permissions:
  contents: write

env:
  PROTON_VERSION: ${{ github.event.inputs.proton_version }}

jobs:
  build-decoration-fix:
    runs-on: ubuntu-latest
    # Optional: without it build.sh ships GE's stock winewayland.drv, which
    # works everywhere except compositors that need the #955 fix (niri).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached winewayland.drv
        # Inputs are fixed: the GE tag, the fix commit pinned in the script,
        # and the script itself. On a hit the whole build is skipped.
        # Bump the "v1" to force a rebuild.
        id: deco-cache
        uses: actions/cache@v4
        with:
          path: build/decoration-fix
          key: decoration-fix-v1-${{ env.PROTON_VERSION }}-${{ hashFiles('scripts/fix-wayland-decoration.sh') }}
      - name: Free disk space
        if: steps.deco-cache.outputs.cache-hit != 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          large-packages: false
      - name: Build fixed winewayland.drv
        if: steps.deco-cache.outputs.cache-hit != 'true'
        # The full make output is far too large for the Actions log viewer
        # (it gets truncated), so keep it in a file and only echo milestones
        # and errors live. The full log is uploaded as an artifact below.
        shell: bash
        run: |
          mkdir -p build
          ./scripts/fix-wayland-decoration.sh 2>&1 \
            | tee build/decoration-fix.log \
            | { grep --line-buffered -E '^(Cloning|Fetching|Registered|Initializing|Building|Fixed|Fix |GNU make|Could not)|error:|Error [0-9]+' || true; } \
            | { grep --line-buffered -v -E "^libtool: +error: +(Could not determine the host path|Continuing, but uninstalled|')" || true; }
      - name: Show end of build log on failure
        if: failure()
        run: tail -n 300 build/decoration-fix.log
      - name: Upload full build log
        if: always() && steps.deco-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: decoration-fix-log
          path: build/decoration-fix.log
      - uses: actions/upload-artifact@v4
        with:
          name: decoration-fix
          path: build/decoration-fix/

  build-winegdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached GDK dlls
        # The sources are SHA-256 pinned inside the script, so its hash
        # identifies the result. On a hit the download is skipped.
        id: dll-cache
        uses: actions/cache@v4
        with:
          path: build/winegdk-dlls
          key: winegdk-dlls-v2-${{ hashFiles('scripts/collect-winegdk-dlls.sh') }}
      - name: Collect GDK dlls
        if: steps.dll-cache.outputs.cache-hit != 'true'
        run: ./scripts/collect-winegdk-dlls.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winegdk-dlls
          path: build/winegdk-dlls/

  package-and-release:
    needs: [build-decoration-fix, build-winegdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # Missing when the optional decoration fix failed.
        continue-on-error: true
        with:
          name: decoration-fix
          path: build/decoration-fix
      - uses: actions/download-artifact@v4
        with:
          name: winegdk-dlls
          path: build/winegdk-dlls
      - name: Build package
        run: ./scripts/build.sh
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: GDK-${{ env.PROTON_VERSION }}-${{ github.run_number }}
          name: GDK-${{ env.PROTON_VERSION }}
          files: GDK-${{ env.PROTON_VERSION }}-x86_64.tar.gz
