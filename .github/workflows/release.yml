name: Build and release GDK-Proton

on:
  workflow_dispatch:
    inputs:
      proton_version:
        description: "GE-Proton version to base the build on (e.g. Proton11-12)"
        required: true
        default: "Proton11-12"

permissions:
  contents: write

env:
  PROTON_VERSION: ${{ github.event.inputs.proton_version }}

jobs:
  build-decoration-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false
      - name: Build fixed winewayland.drv
        # The full make output is far too large for the Actions log viewer
        # (it gets truncated), so keep it in a file and only echo milestones
        # and errors live. The full log is uploaded as an artifact below.
        shell: bash
        run: |
          mkdir -p build
          ./scripts/fix-wayland-decoration.sh 2>&1 \
            | tee build/decoration-fix.log \
            | { grep --line-buffered -E '^(Cloning|Fetching|Registered|Initializing|Building|Fixed|Fix |GNU make|Could not)|error:|Error [0-9]+' || true; }
      - name: Show end of build log on failure
        if: failure()
        run: tail -n 300 build/decoration-fix.log
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decoration-fix-log
          path: build/decoration-fix.log
      - uses: actions/upload-artifact@v4
        with:
          name: decoration-fix
          path: build/decoration-fix/

  build-winegdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Drop duplicate IDL entry in WineGDK
        # include/Makefile.in lists windows.ui.text.core.idl twice, so
        # `make install` aborts with "not overwriting just created
        # windows.ui.text.core.idl". Keep only the first occurrence.
        run: |
          f=WineGDK/include/Makefile.in
          awk '/^\twindows\.ui\.text\.core\.idl \\$/ { if (seen++) next } { print }' "$f" > "$f.new"
          mv "$f.new" "$f"
          test "$(grep -c 'windows\.ui\.text\.core\.idl' "$f")" -eq 1
      - name: Build WineGDK
        # path: ref: the submodule is a shallow clone, so git+file: (the default)
        # fails with "revCount is not available". The flake only uses src = ./.
        run: nix build "path:$PWD/WineGDK#wine-gdk64" --out-link build/winegdk-result
      - name: Collect GDK dlls
        run: ./scripts/collect-winegdk-dlls.sh
      - uses: actions/upload-artifact@v4
        with:
          name: winegdk-dlls
          path: build/winegdk-dlls/

  package-and-release:
    needs: [build-decoration-fix, build-winegdk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: decoration-fix
          path: build/decoration-fix
      - uses: actions/download-artifact@v4
        with:
          name: winegdk-dlls
          path: build/winegdk-dlls
      - name: Build package
        run: ./scripts/build.sh
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: GDK-${{ env.PROTON_VERSION }}-${{ github.run_number }}
          name: GDK-${{ env.PROTON_VERSION }}
          files: GDK-${{ env.PROTON_VERSION }}-x86_64.tar.gz
